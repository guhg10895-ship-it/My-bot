name: 🔓 GHOST Unlock Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: unlock-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install System Tools (including hashcat)
        run: |
          sudo apt-get update
          sudo apt-get install -y fcrackzip unrar p7zip-full john hashcat
          echo "✅ hashcat installed: $(which hashcat || echo 'Not found')"

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pyTelegramBotAPI requests

      - name: 📂 Setup Wordlist
        run: |
          if [ -f /usr/share/wordlists/rockyou.txt.gz ]; then
            sudo gunzip -c /usr/share/wordlists/rockyou.txt.gz > rockyou.txt
          else
            curl -L -o rockyou.txt https://raw.githubusercontent.com/brannondorsey/naive-hashcat/master/rockyou.txt
          fi
          echo "✅ Wordlist size: $(wc -l < rockyou.txt) lines"

      - name: 🤖 Run Bot
        run: python bot.py
