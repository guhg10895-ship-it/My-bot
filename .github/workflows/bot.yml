name: 🔓 GHOST Unlock Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: unlock-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fcrackzip unrar p7zip-full john
          # zip2john က john package ထဲမှာပါတယ် — ဒါပေမယ့် သီးခြား install မလုပ်ရဘူး
          echo "✅ fcrackzip installed: $(which fcrackzip)"
          echo "✅ 7z installed: $(which 7z)"
          echo "✅ john installed: $(which john)"
          # zip2john ရှိမရှိ စစ်ပါ
          if [ -f /usr/share/john/zip2john ]; then
            echo "✅ zip2john found in /usr/share/john/"
            sudo ln -sf /usr/share/john/zip2john /usr/local/bin/zip2john
          else
            echo "⚠️ zip2john not found — will use john directly"
          fi

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pyTelegramBotAPI requests

      - name: 📂 Setup Wordlist
        run: |
          if [ -f /usr/share/wordlists/rockyou.txt.gz ]; then
            sudo gunzip -c /usr/share/wordlists/rockyou.txt.gz > rockyou.txt
          else
            curl -L -o rockyou.txt https://raw.githubusercontent.com/brannondorsey/naive-hashcat/master/rockyou.txt
          fi
          echo "✅ Wordlist size: $(wc -l < rockyou.txt) lines"

      - name: 🤖 Run Bot
        run: python bot.py
