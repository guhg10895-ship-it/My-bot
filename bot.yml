name: 🔓 GHOST Unlock Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: unlock-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fcrackzip unrar p7zip-full
          pip install pyTelegramBotAPI requests rarfile py7zr

      - name: 📂 Setup Wordlist
        run: |
          if [ -f /usr/share/wordlists/rockyou.txt.gz ]; then
            sudo gunzip -c /usr/share/wordlists/rockyou.txt.gz > rockyou.txt
          else
            curl -L -o rockyou.txt https://raw.githubusercontent.com/brannondorsey/naive-hashcat/master/rockyou.txt
          fi

      - name: 🤖 Run Bot
        run: python bot.py
